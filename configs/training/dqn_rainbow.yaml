# Rainbow DQN training configuration.
#
# This file is loaded by trainer.py via the --config CLI flag.
# Config priority: CLI args > YAML file > trainer/config.py dataclass defaults.
#
# total_samples is the primary knob -- total transitions fed to the optimizer.
# Derived: total_steps = total_samples * train_every / batch_size
#   1B * 4 / 256 ~ 15.6M env steps @ batch_size=256
#
training:
  algorithm: "dqn"
  total_samples: 1_000_000_000
  eval_every: 10_000
  eval_episodes: 100
  save_every: 10_000
  log_every: 100
  num_envs: 64
  use_pretrain: true
  num_pretrain_episodes: 1000
  num_pretrain_envs: 16
  pretrain_epochs: 50
  device: "cuda"
  seed: 42

dqn:
  gamma: 0.99
  n_step: 5
  lr: 2.5e-4           # Conservative lr -- prevents online drift with soft sync
  batch_size: 256
  train_every: 4        # Train every N environment steps
  target_update_freq: 4000     # Anchor hard-sync interval (soft-sync mode)
  target_update_tau: 0.001     # Polyak averaging coefficient per training step
  use_hard_update: true       # Soft sync (Polyak) every step; true = hard sync
  replay_capacity: 2_000_000   # ~4.4 GB RAM for float32 transitions
  per_alpha: 0.3               # PER alpha (low = near-uniform, prevents death domination)
  per_beta_start: 0.4          # IS correction start
  per_beta_end: 1.0            # IS correction end
  per_beta_frames: 3_000_000   # beta anneals to 1.0 over this many training steps
  per_reward_weight: 0.5       # Reward multiplier in blended priority formula
  per_reward_blend: 0.3        # Blend: low=TD-focused, high=reward-focused
  per_reward_clip: 10.0        # Cap |reward| in priority calc — prevents outlier domination
  per_uniform_ratio: 0.2       # Uniform fraction in each batch (0=pure PER, 1=pure uniform)
  loss_type: "huber"           # "huber" (SmoothL1Loss) or "mse" (MSELoss)
  huber_beta: 1.0              # SmoothL1Loss beta -- L1<--|td|<=beta-->L2 transition threshold
  grad_clip_norm: 10.0

network:
  # model_size presets --------------------------------------------------
  # CNN-based:
  #   small       (0.14M)  CNN 32ch,  hidden 128
  #   medium      (0.51M)  CNN 64ch,  hidden 256
  #   large       (1.96M)  CNN 128ch, hidden 512
  #
  # Transformer-based (pre-LN, global residual):
  #   transformer_small  (0.67M)   d=128,  L=2
  #   transformer_base   (5.8M)    d=256,  L=6
  #   transformer_medium (24M)     d=384,  L=12
  #   transformer_large  (104M)    d=640,  L=20
  #   transformer_huge   (282M)    d=896,  L=28
  #   transformer_giant  (418M)    d=1024, L=32
  #   transformer_mega   (968M)    d=1280, L=48
  model_size: "medium"
  cnn_channels: 64
  hidden_dim: 256
  feature_dim: 53
  num_actions: 112
  use_noisy: true
  sigma_init: 0.01            # NoisyNet initial noise (conservative)
  sigma_decay: 0.9999997      # Per-step sigma decay; ~41% at 3M, ~1% at 15.6M

env:
  use_cpp_env: true
